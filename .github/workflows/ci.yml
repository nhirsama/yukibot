name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      require_complete_unit:
        description: Enforce exact 100% unit coverage (does not authorize Python removal)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: yukibot
          POSTGRES_PASSWORD: yukibot-ci
          POSTGRES_DB: yukibot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yukibot -d yukibot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run vet
        run: go vet ./...

      - name: Set up Python oracle
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Run both implementations, differential tests and coverage
        env:
          YUKIBOT_DATABASE_URL: postgres://yukibot:yukibot-ci@localhost:5432/yukibot_test?sslmode=disable
        run: bash scripts/check-parity.sh

      - name: Enforce retirement coverage prerequisite when requested
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.require_complete_unit }}
        run: uv run python scripts/coverage_summary.py coverage --require-complete-unit

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-go-coverage
          path: coverage/
          if-no-files-found: error

      - name: Check reachable dependency vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

      - name: Build binary
        run: go build ./cmd/yukibot

  publish:
    name: Publish image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
