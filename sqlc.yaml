version: "2"
sql:
  - engine: postgresql
    schema: db/schema.sql
    queries: db/queries
    gen:
      go:
        package: dbsql
        out: internal/storage/dbsql
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: jsonb
            go_type:
              import: encoding/json
              type: RawMessage
              pointer: false
