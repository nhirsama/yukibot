[project]
name = "yukibot"
version = "0.1.0"
description = "Composable Telegram userbot features"
readme = "README.md"
authors = [{ name = "nhirsama" }]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "COPYRIGHT"]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.21,<1",
    "openai>=2.53,<3",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "telethon>=1.44,<1.45",
]

[project.scripts]
yukibot = "yukibot.__main__:main"

[project.urls]
Repository = "https://github.com/nhirsama/yukibot"
Source = "https://github.com/nhirsama/yukibot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.17.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/yukibot"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
